name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, build and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # NSIS EST INSTALLÉ POUR QUE `scripts/installeur-compile.test.ts` NE S'IGNORE PAS.
      #
      # Ce cas compile `build/installer.nsh` et s'ignore quand `makensis` est absent — un poste de
      # développement n'a aucune raison d'avoir NSIS. Sans cette étape il s'ignorerait donc ICI
      # aussi, et le garde serait muet là où il sert le plus.
      #
      # CE QU'IL AURAIT ÉVITÉ : la construction de la v5.0.1 est tombée sur makensis, « could not
      # resolve label », pour un `/SD` écrit avant le texte d'un `MessageBox` au lieu d'après. NSIS
      # ne tournant que dans le workflow de RELEASE, la faute s'est découverte après le tag. Elle
      # se découvre maintenant sur la branche, en une trentaine de secondes.
      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          # ET L'INSTALLATION EST VÉRIFIÉE, PARCE QUE `choco install` SORT EN ZÉRO QUAND IL
          # N'INSTALLE RIEN. Le 2026-10-12, le dépôt Chocolatey a rendu un 504 Gateway Timeout :
          # le journal disait « Unable to find package 'nsis' » puis « Chocolatey installed 0/0
          # packages », et l'étape s'est déclarée RÉUSSIE. L'échec n'est apparu que trois minutes
          # plus tard, à l'étape Test, sous un message qui réclamait d'ajouter une étape DÉJÀ
          # PRÉSENTE dans ce fichier. Une étape qui ne fait rien doit échouer là où elle est.
          $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path $makensis)) {
            throw "NSIS n'est pas installé : $makensis est absent. Le paquet a-t-il pu être récupéré ?"
          }
          # ET LE DOSSIER EST AJOUTÉ AU PATH À LA MAIN, parce que choco ne suffit pas ici :
          # il met à jour le PATH DE LA MACHINE, et le job tourne avec celui qu'il a capturé à son
          # démarrage. Sans cette ligne, l'installation réussit, `makensis` reste introuvable à
          # l'étape suivante, et le cas qui compile l'installeur S'IGNORE — c'est exactement ce
          # qu'on a vu au premier essai, et c'est le second cas du fichier qui l'a dit.
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files (x86)\NSIS' -Encoding utf8

      - name: Test
        run: npm run test

      # LE HARNAIS ELECTRON TOURNE ICI, SINON IL NE TOURNE NULLE PART.
      #
      # `npm run test` est la suite unitaire ; elle s'exécute sans jamais lancer l'application, et
      # `window.api` n'y existe pas. Les cas de `tests-e2e/pont-electron-vivant.spec.ts` lancent la
      # VRAIE application sur `dist/index.html` : l'âge du build, le préchargement, les soixante-deux
      # canaux du pont, le schéma `attic-res:` et deux composants à modèle de bout en bout. Sans
      # cette étape ils ne s'exécuteraient que lorsqu'on y pense, et c'est précisément ce que l'étape
      # NSIS ci-dessus existe pour éviter.
      #
      # LE BINAIRE EST ASSURÉ D'ABORD, pour la même raison que dans le workflow de release : il peut
      # manquer quand `node_modules` revient du cache sans que le script d'installation du paquet
      # Electron ait tourné. Et la vérification suit, parce qu'une étape qui ne fait rien doit
      # échouer là où elle est : c'est la leçon du 2026-10-12, où `choco install` a rendu zéro
      # paquet en sortant en zéro.
      - name: Ensure Electron binary is present
        run: |
          node node_modules/electron/install.js
          $electron = 'node_modules\electron\dist\electron.exe'
          if (-not (Test-Path $electron)) {
            throw "Le binaire d'Electron est absent : $electron. Le téléchargement a-t-il abouti ?"
          }

      # CE QUI S'IGNORE ICI, C'EST EXACTEMENT LES GGUF D'`audio.cpp`, et c'est assumé. Le
      # `postinstall` ramène tolérément les familles ONNX, Sherpa et Magenta, le paquet Whisper avec
      # elles : le cas du schéma `attic-res:` tourne donc ici, puisque `npm ci` lui a déjà posé son
      # fichier. Rien en revanche ne ramène les modèles d'`audio.cpp`, que seul le panneau des
      # modèles va chercher, et les deux cas qui en dépendent s'ignorent : l'étiqueteur CED pèse
      # 343 Mo et le séparateur RoFormer 457 Mo, soit 800 Mo (762 Mio) par passe. Chacun dit la
      # raison de son abandon plutôt que de se taire.
      #
      # RELEVÉ SUR LA PASSE DU 2026-10-21, et non supposé : « 3 passed, 1 skipped (17.7s) » sur le
      # coureur Windows, l'ignoré étant l'étiqueteur. J'avais annoncé deux abandons en comptant
      # Whisper parmi les modèles absents, faute d'avoir lu le `postinstall` qui le ramène.
      - name: Electron end-to-end
        run: npm run test:electron
