name: Release Electron

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v2.2.0)'
        required: true
        type: string

jobs:
  release:
    name: Build and publish Electron installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Le postinstall récupère ces fichiers en mode tolérant : un échec y est
      # signalé mais n'interrompt pas l'installation. On revalide donc ici, en
      # mode bloquant, avant de construire quoi que ce soit — sans quoi on
      # publierait un installeur dont le nœud Sherpa ASR est muet, avec un job
      # vert pour seule indication.
      - name: Verify the Sherpa WASM files
        run: npm run download:sherpa-wasm

      # LA REVALIDATION DU MODÈLE GTCRN A ÉTÉ RETIRÉE LE 2026-10-08, et celle de Sherpa gardée :
      # la différence est l'endroit où chacun voyage. Les fichiers WASM de Sherpa vivent dans
      # public/sherpa-onnx-wasm/ et partent DANS le paquet, par dist/ ; `build.files` exclut
      # dist/oonx/**/*, de sorte que public/oonx n'atteignait l'installeur que par
      # `extraResources` — d'où il est sorti. GTCRN se prend désormais depuis l'application,
      # comme les dix-neuf autres modèles, et il n'y a plus rien à revalider avant de construire.

      - name: Ensure Electron binary is present
        run: node node_modules/electron/install.js

      # L'installeur ne porte plus aucun modèle : `public/oonx` a quitté `extraResources` le
      # 2026-10-08, et les vingt modèles du manifeste se prennent depuis l'application. Cette
      # étape ne sert donc plus qu'au SOUNDFONT, `public/sf2`, et il N'EST PAS CONCERNÉ par ce
      # mouvement : décidé par Fabien le 2026-10-08, le SoundFont RESTE EMBARQUÉ dans
      # l'installeur. Ce n'est pas un modèle qu'on choisit de prendre ou non — c'est ce avec quoi
      # tout instrument MIDI du catalogue sonne, et une application qui s'ouvre muette n'a rien
      # à offrir à qui l'essaie.
      #
      # CE QUI RESTE À PAYER, ET QUI EST D'UN AUTRE ORDRE : il n'est pas dans git et ne voyage
      # que dans `assets.zip`, soit 2 060 571 648 octets rapatriés ici pour en extraire 141,5 Mo.
      # Publier `sf2.zip` à part ferait tomber ce téléchargement à cent quarante méga-octets SANS
      # rien changer à ce qui part dans l'installeur, les deux questions étant distinctes. Cette
      # publication-là n'a pas été décidée.
      - name: Download the bundled SoundFont
        run: |
          gh release download assets -p assets.zip --dir .
          7z x assets.zip -y
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # LE MODÈLE AUDIOBOX (400 Mo) N'EST PLUS RAPATRIÉ ICI, pour la même raison que GTCRN : il
      # vivait dans public/oonx, que l'installeur ne porte plus. Il reste publié à part sur la
      # release `assets`, vérifié par son SHA-256, et `npm run download:audiobox-aesthetics`
      # reste disponible pour un poste de développement — il n'a simplement plus sa place dans
      # la construction d'un installeur qui n'embarque aucun modèle.

      # « music collection » est embarquée (extraResources) mais ignorée par git :
      # absente du checkout, elle était sautée par electron-builder avec un simple
      # avertissement, et les installeurs 3.x sont partis sans elle. Elle vient de
      # music-collection.zip sur la release `assets`, vérifiée fichier par fichier
      # contre scripts/music-collection.manifest.json.
      - name: Download the demo music collection
        run: npm run download:music-collection

      - name: Build the installer
        shell: pwsh
        run: |
          # Packaging as a single asar archive consumes excessive memory for this
          # app's bundled assets. Disable asar in the checked-out package.json before
          # building so the final app remains unpacked.
          node -e "const p = require('./package.json'); p.build.asar = false; require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2) + '\n');"
          # Build with the full dev dependency tree.
          npm run build
          npm run ensure-songsee
          # Chaque source de build.extraResources doit exister et avoir un contenu :
          # electron-builder n'échoue pas quand l'une manque, il avertit et continue.
          node scripts/verify-bundled-resources.cjs
          if ($LASTEXITCODE -ne 0) { throw "Ressource embarquee absente ou vide" }
          # electron-builder scans node_modules when packaging. With the full dependency
          # tree this exhausts the GitHub runner memory. Keep Electron aside, shrink
          # dependencies to only those used by the main process, and prune.
          Copy-Item -Path node_modules/electron/dist -Destination electron-dist -Recurse
          node -e "
            const p = require('./package.json');
            const fs = require('fs');
            const ver = (n) => { try { return require('./node_modules/' + n + '/package.json').version; } catch { return '*'; } };
            p.dependencies = {
              '@huggingface/tokenizers': ver('@huggingface/tokenizers'),
              'adm-zip': p.dependencies['adm-zip'] || ver('adm-zip'),
              'electron-updater': p.dependencies['electron-updater'] || ver('electron-updater'),
              'onnxruntime-node': p.dependencies['onnxruntime-node'] || ver('onnxruntime-node')
            };
            fs.writeFileSync('./package.json', JSON.stringify(p, null, 2) + '\n');
          "
          npm prune --production
          # Re-install only the packager so it can run against the production tree.
          npm install --no-save electron-builder@26.15.3
          # Point the packager to the saved Electron distribution via package.json.
          node -e "const p = require('./package.json'); p.build.electronDist = 'electron-dist'; require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2) + '\n');"
          # Nom d'artefact SANS ESPACE : le défaut (« Attic Setup 3.1.5.exe »)
          # serait renommé au téléversement et ne correspondrait plus à l'URL
          # inscrite dans latest.yml.
          #
          # Réglé en patchant package.json, et non par « -c.nsis.artifactName=… »
          # sur la ligne de commande : PowerShell scinde cet argument en « -c » et
          # « .nsis.artifactName=… », qu'electron-builder prend alors pour un
          # chemin de fichier de configuration — c'est ce qui a fait échouer la
          # première tentative. Le backtick échappe le dollar pour que ${version}
          # parvienne littéralement à node.
          node -e "const p = require('./package.json'); p.build.nsis.artifactName = 'Attic-Setup-`${version}.`${ext}'; require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2) + '\n');"
          # On construit SANS publier. Laisser electron-builder téléverser lui-même
          # (« -p always ») a fait perdre un asset sur chacune des deux dernières
          # releases, sans jamais échouer : sur la v3.1.4 le blockmap n'est pas
          # arrivé, sur la v3.1.5 c'est l'installeur de 1,66 Go — le job s'est
          # terminé 98 secondes après le début de son téléversement, et a rapporté
          # un succès. Le téléversement se fait donc à l'étape suivante, avec un
          # outil qui attend la fin et signale les erreurs.
          npm exec -- electron-builder --win -p never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder a echoue" }
          # Contrôle a posteriori : ce qui est réellement dans l'application construite.
          node scripts/verify-bundled-resources.cjs --paquet release/win-unpacked/resources
          if ($LASTEXITCODE -ne 0) { throw "Ressource embarquee absente ou incomplete dans l'application" }
        env:
          # electron-builder can exceed the default Node heap on larger apps.
          NODE_OPTIONS: --max-old-space-size=14336

      - name: Publish the installer to the GitHub release
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $exe = Get-ChildItem release -Filter 'Attic-Setup-*.exe' |
                 Where-Object { $_.Name -notlike '*__uninstaller*' }
          $blockmap = Get-ChildItem release -Filter 'Attic-Setup-*.exe.blockmap'
          $yml = Get-Item release/latest.yml
          if (-not $exe -or -not $blockmap -or -not $yml) {
            throw "Fichier manquant a la sortie du build : exe=$($exe.Count) blockmap=$($blockmap.Count) latest.yml=$($yml.Count)"
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title $tag --notes "Attic $tag" }

          # --clobber pour qu'une reprise apres echec remplace un asset partiel
          # au lieu de buter dessus.
          gh release upload $tag $exe.FullName $blockmap.FullName $yml.FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "Le televersement a echoue" }

          # Vérification a posteriori : c'est l'absence de ce contrôle qui a laissé
          # passer deux releases incompletes en se fiant au code de retour.
          $attendus = @($exe.Name, $blockmap.Name, $yml.Name)
          $publies = gh release view $tag --json assets --jq '.assets[] | "\(.name):\(.size)"'
          Write-Host "Assets publies :`n$publies"
          foreach ($nom in $attendus) {
            $ligne = $publies | Where-Object { $_ -like "$nom`:*" }
            if (-not $ligne) { throw "Asset absent de la release : $nom" }
            if ([int]($ligne -split ':')[-1] -le 0) { throw "Asset vide : $ligne" }
          }
          Write-Host "Les $($attendus.Count) assets attendus sont bien publies."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
